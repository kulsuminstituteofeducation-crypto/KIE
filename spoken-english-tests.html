<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoken English Tests | KulsUM Institute of Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Keep your existing .topbar and .site-header from test page.rtf here -->

  <section class="page-hero">
    <div class="container">
      <div class="eyebrow">Practice &amp; Assessment</div>
      <h1 id="quiz-title">Spoken English &amp; Grammar Tests</h1>
      <p>Choose a topic below to start your interactive assessment and receive instant scoring and explanations.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <!-- Topic Selection View -->
      <div id="topic-view">
        <div id="topic-grid" class="feature-grid"></div>
      </div>

      <!-- Active Quiz View -->
      <div id="quiz-view" style="display:none;">
        <div class="test-shell">
          <button type="button" id="back-btn" class="btn btn-outline" style="margin-bottom:1.5rem;">&larr; Back to All Tests</button>
          <h2 id="quiz-head"></h2>
          <p id="quiz-desc"></p>

          <form id="quiz-form">
            <div id="questions"></div>
            <div class="test-actions" style="margin-top:2rem;">
              <button type="submit" class="btn btn-gold">Submit Test</button>
            </div>
          </form>

          <!-- Result Panel -->
          <div id="result" class="test-result">
            <h3>Your Result</h3>
            <div id="score" class="result-score"></div>
            <div id="percent" class="result-percent"></div>
            <p id="message"></p>
            <div class="result-actions">
              <button type="button" id="download" class="btn btn-gold">Download Result</button>
              <button type="button" id="retake" class="btn btn-outline">Retake Test</button>
            </div>
            <div id="solutions" style="margin-top:2rem;"></div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Keep your existing footer and script.js from test page.rtf here -->

  <script>
    const TOPICS = [
      // Original 10 Spoken English Tests (20 questions each)
      { name: "Daily Conversation", level: "Basic & medium level" },
      { name: "Common Grammar", level: "Basic & medium level" },
      { name: "Everyday Vocabulary", level: "Basic & medium level" },
      { name: "Tenses Practice", level: "Basic & medium level" },
      { name: "Prepositions", level: "Basic & medium level" },
      { name: "Articles & Determiners", level: "Basic & medium level" },
      { name: "Sentence Structure", level: "Basic & medium level" },
      { name: "Polite Expressions", level: "Basic & medium level" },
      { name: "Pronunciation & Spelling", level: "Basic & medium level" },
      { name: "Reading Comprehension", level: "Basic & medium level" },

      // 7 New Master Assessments from Uploaded PDFs (50 questions each)
      { name: "Advanced English Syntax Master Assessment", level: "50-Question Master Assessment" },
      { name: "Future Tense Master Assessment", level: "50-Question Special Assessment" },
      { name: "Module 1: Master Phonics Assessment (Set A)", level: "Chapters 01–19 · Set A" },
      { name: "Module 1: Master Phonics Assessment (Set B)", level: "Chapters 01–19 · Set B" },
      { name: "Module 2: Parts of Speech Assessment (Set A)", level: "Chapters 01–19 · Set A" },
      { name: "Module 2: Master Grammar Assessment (Set C)", level: "Chapters 01–20 · Set C" },
      { name: "Module 3: All 12 Tenses Master Assessment", level: "Present, Past & Future Tenses" }
    ];

    const DATA = {
      // Paste your existing 10 test arrays from test page.rtf here,
      // followed by the 7 new 50-question assessment arrays.
    };

    const grid = document.getElementById('topic-grid');
    const tv = document.getElementById('topic-view');
    const qv = document.getElementById('quiz-view');
    const box = document.getElementById('questions');
    const form = document.getElementById('quiz-form');
    const result = document.getElementById('result');
    const solutions = document.getElementById('solutions');

    let current = '';
    let last = null;

    function renderTopics() {
      grid.innerHTML = '';
      TOPICS.forEach(function(t, i) {
        const list = DATA[t.name] || [];
        const count = list.length;
        const d = document.createElement('div');
        d.className = 'feature-card';
        d.innerHTML =
          '<div class="eyebrow">Test ' + (i + 1) + '</div>' +
          '<h3>' + t.name + '</h3>' +
          '<p>' + count + ' questions &middot; ' + (t.level || 'Basic &amp; medium level') + '</p>' +
          '<button type="button" class="btn btn-gold topic-button"' + (count === 0 ? ' disabled' : '') + '>' +
          (count === 0 ? 'Coming Soon' : 'Start Test') +
          '</button>';
        if (count > 0) {
          d.querySelector('button').onclick = function() { openQuiz(t.name); };
        }
        grid.appendChild(d);
      });
    }

    function openQuiz(name) {
      current = name;
      const total = DATA[name].length;
      tv.style.display = 'none';
      qv.style.display = 'block';
      result.classList.remove('show');
      solutions.innerHTML = '';
      document.getElementById('quiz-title').textContent = name;
      document.getElementById('quiz-head').textContent = name;
      document.getElementById('quiz-desc').textContent =
        total + ' questions. Select one answer for each question, then submit to get your score, percentage and explanations.';
      box.innerHTML = '';

      DATA[name].forEach(function(x, i) {
        const d = document.createElement('div');
        d.className = 'test-question';
        let o = '';
        x.options.forEach(function(v, j) {
          const letter = String.fromCharCode(65 + j);
          o +=
            '<label class="test-option">' +
            '<input type="radio" name="q' + i + '" value="' + letter + '"> ' +
            '<span><strong>' + letter + '.</strong> ' + v + '</span>' +
            '</label>';
        });
        d.innerHTML = '<h3>' + (i + 1) + '. ' + x.question + '</h3><div class="test-options">' + o + '</div>';
        box.appendChild(d);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSolutions() {
      solutions.innerHTML = '<h4>Answer Key &amp; Explanations</h4>';
      DATA[current].forEach(function(x, i) {
        const picked = form.querySelector('input[name="q' + i + '"]:checked');
        const userAns = picked ? picked.value : '-';
        const ok = userAns === x.answer;
        const item = document.createElement('div');
        item.className = 'solution-item ' + (ok ? 'correct' : 'incorrect');
        item.innerHTML =
          '<p><strong>Q' + (i + 1) + ':</strong> ' + x.question + '</p>' +
          '<p>Your answer: <strong>' + userAns + '</strong> | Correct answer: <strong>' + x.answer + '</strong></p>' +
          (x.explanation ? '<p class="explanation">' + x.explanation + '</p>' : '');
        solutions.appendChild(item);
      });
    }

    form.onsubmit = function(e) {
      e.preventDefault();
      const qs = DATA[current];
      const total = qs.length;
      let score = 0;
      const missing = [];

      qs.forEach(function(x, i) {
        const s = form.querySelector('input[name="q' + i + '"]:checked');
        if (!s) missing.push(i + 1);
        else if (s.value === x.answer) score++;
      });

      if (missing.length) {
        alert('Please answer question(s): ' + missing.join(', ') + '.');
        return;
      }

      const pct = Math.round((score / total) * 100);
      last = {
        topic: current,
        score: score,
        total: total,
        percentage: pct,
        date: new Date().toLocaleString()
      };

      document.getElementById('score').textContent = score + ' / ' + total;
      document.getElementById('percent').textContent = 'Percentage: ' + pct + '%';
      document.getElementById('message').textContent =
        pct >= 80
          ? 'Excellent work! Review the solutions and keep practising.'
          : pct >= 60
          ? 'Good progress! Review the explanations and practise again.'
          : 'Keep practising. Review the solutions and try the test again.';

      showSolutions();
      result.classList.add('show');
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    document.getElementById('back-btn').onclick = function() {
      qv.style.display = 'none';
      tv.style.display = 'block';
      document.getElementById('quiz-title').textContent = 'Spoken English & Grammar Tests';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('retake').onclick = function() {
      openQuiz(current);
    };

    document.getElementById('download').onclick = function() {
      if (!last) return;
      const text =
        'KulsUM Institute of Education - Test Result\n' +
        'Test: ' + last.topic + '\n' +
        'Score: ' + last.score + ' / ' + last.total + ' (' + last.percentage + '%)\n' +
        'Date: ' + last.date + '\n';
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = last.topic.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-result.txt';
      a.click();
    };

    renderTopics();
  </script>
</body>
</html>
